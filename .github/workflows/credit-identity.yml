name: Credit identity

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  credit-identity:
    name: Exact author, committer and credit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect exact PR objects with trusted base validator
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import tempfile

          def require(value, reason):
              if not value:
                  raise SystemExit('CREDIT CI FAILED CLOSED: ' + reason)

          require(os.environ['GITHUB_EVENT_NAME'] == 'pull_request_target', 'wrong event')
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pr = event['pull_request']
          repo = os.environ['GITHUB_REPOSITORY']
          require(re.fullmatch(r'soliskit/[A-Za-z0-9_.-]+', repo), 'unexpected repository')
          require(pr['base']['repo']['full_name'] == repo, 'wrong base repository')
          number = event['number']
          require(type(number) is int and number > 0, 'invalid PR number')
          base = pr['base']['sha']
          head = pr['head']['sha']
          require(all(re.fullmatch(r'[0-9a-f]{40}', x) for x in (base, head)), 'invalid exact SHA')
          env = {k:v for k,v in os.environ.items() if not k.startswith('GIT_')}
          env.update(GIT_CONFIG_NOSYSTEM='1', GIT_CONFIG_GLOBAL='/dev/null', GIT_TERMINAL_PROMPT='0')
          env.pop('GITHUB_TOKEN', None)
          env.pop('GH_TOKEN', None)
          with tempfile.TemporaryDirectory() as work:
              def git(*args):
                  subprocess.run(['/usr/bin/git', '-C', work, *args], check=True, env=env, timeout=120)
              git('init', '--quiet')
              git('remote', 'add', 'origin', 'https://github.com/' + repo + '.git')
              git('fetch', '--no-tags', 'origin', base, 'refs/pull/' + str(number) + '/head:refs/inspection/head')
              actual = subprocess.check_output(['/usr/bin/git', '-C', work, 'rev-parse', 'refs/inspection/head'], env=env, timeout=10).decode().strip()
              require(actual == head, 'PR head moved; rerun on current event, do not inspect wrong head')
              probe = subprocess.run(['/usr/bin/git', '-C', work, 'cat-file', '-e', base + ':.credit-guard/strict_guard.py'], env=env, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, timeout=10)
              require(probe.returncode == 0, 'trusted base has no installed validator; bootstrap required')
              git('checkout', base, '--', '.credit-guard')
              trusted = pathlib.Path(work) / '.credit-guard'
              require(trusted.is_dir(), 'trusted base has no installed validator')
              print('CREDIT CI: trusted source base=' + base + ' proposed head=' + head + ' repo=' + repo, flush=True)
              subprocess.run([sys.executable, str(trusted / 'strict_guard.py'), '--repo', work, '--tip', head], check=True, env=env, timeout=420)
