name: Temporary exact-root qualification
"on":
  workflow_dispatch:
    inputs:
      expected_root:
        description: Exact independently reviewed root SHA for this one approved attempt
        required: true
        type: string
concurrency:
  group: temporary-exact-root-qualification
  cancel-in-progress: false
jobs:
  test:
    env:
      QUALIFICATION_HEAD: ${{ github.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tests: ${{ steps.counts.outputs.tests }}
      skipped: ${{ steps.counts.outputs.skipped }}
      e2e_expected: ${{ steps.e2e.outputs.expected }}
      e2e_skipped: ${{ steps.e2e.outputs.skipped }}
      delivery_passed: ${{ steps.e2e.outputs.delivery_passed }}
      delivery_skipped: ${{ steps.e2e.outputs.delivery_skipped }}
    steps:
      - name: Require the exact approved dispatch root
        env:
          EXPECTED_ROOT: ${{ inputs.expected_root }}
          ACTUAL_ROOT: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: python
        run: "import os, re\nexpected = os.environ[\"EXPECTED_ROOT\"]\nif not re.fullmatch(r\"[a-f0-9]{40}\", expected) or expected != os.environ[\"ACTUAL_ROOT\"] or os.environ[\"RUN_ATTEMPT\"] != \"1\":\n    raise SystemExit(\"Exact reviewed root and first attempt required\")\nprint(\"QUALIFICATION ROOT \" + expected)\n"
      - name: Set the owned receipt path
        shell: bash
        run: echo "QUALIFICATION_EVIDENCE=$RUNNER_TEMP/normal-browser-receipts" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm install --global npm@12.2.0
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v6
      - run: pip install ruff==0.17.4
      - run: ruff check .
      - run: ruff format --check .
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium webkit
      - name: Check Playwright package version
        run: node -e "process.exit(require('playwright/package.json').version==='1.65.1'?0:1)"
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - name: Check the generated distribution
        run: npm run test:delivery:unit
      - name: Run the unit tests
        shell: bash
        run: "set -o pipefail

          npm test 2>&1 | tee test-output.txt

          "
      - name: Count the unit tests
        id: counts
        if: always()
        shell: bash
        run: "count() { grep -E \"^(#|\u2139) $1 [0-9]+\" test-output.txt | tail -n 1 | grep -oE '[0-9]+$' || true; }\necho \"tests=$(count tests)\" >> \"$GITHUB_OUTPUT\"\necho \"skipped=$(count skipped)\" >> \"$GITHUB_OUTPUT\"\n"
      - name: Prepare fresh separate browser receipts
        run: mkdir "$QUALIFICATION_EVIDENCE"
      - name: Run original-source browser tests
        env:
          QUALIFICATION_SUITE: source
        run: node node_modules/playwright/cli.js test --config playwright.config.js --reporter=list,.github/offline-current/qualification-reporter.mjs --output test-results/source-current
      - name: Run built-delivery browser tests
        env:
          QUALIFICATION_SUITE: delivery
        run: node node_modules/playwright/cli.js test --config playwright.delivery.config.js --reporter=list,.github/offline-current/qualification-reporter.mjs --output test-results/delivery-current
      - run: node scripts/browser-coverage.js
      - name: Validate complete browser results and screenshot assignments
        run: python3 .github/offline-current/validate-reports.py
      - name: Count each completed suite independently
        id: e2e
        shell: bash
        run: "python3 - <<'PYCOUNT'\nimport json, os, pathlib\nreport = json.loads((pathlib.Path(os.environ['QUALIFICATION_EVIDENCE']) / 'validated-browser-receipts.json').read_text())\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    for name, value in {'expected': report['suites']['source']['expected'], 'skipped': report['suites']['source']['skipped'], 'delivery_passed': report['suites']['delivery']['passed'], 'delivery_skipped': report['suites']['delivery']['skipped']}.items():\n        output.write(f'{name}={value}\\n')\nPYCOUNT\n"
      - name: Record exact qualified output identity
        run: node scripts/print-release-identity.mjs
      - name: Print validated receipt summary without uploading files
        shell: python
        run: 'import json, os, pathlib

          p = pathlib.Path(os.environ["QUALIFICATION_EVIDENCE"]) / "validated-browser-receipts.json"

          d = json.loads(p.read_text())

          print("QUALIFICATION VALIDATED RECEIPT " + json.dumps(d, sort_keys=True))

          '
      - name: Package bounded visual receipts for review
        shell: python
        run: "import os, pathlib, tarfile\nroot = pathlib.Path(os.environ['QUALIFICATION_EVIDENCE'])\nfiles = sorted(root.rglob('*'))\nregular = []\ntotal = 0\nfor p in files:\n    if p.is_symlink():\n        raise SystemExit('Symlink in evidence')\n    if p.is_dir():\n        continue\n    if not p.is_file() or p.stat().st_size > 8 * 1024 * 1024:\n        raise SystemExit('Nonregular or oversized evidence file')\n    total += p.stat().st_size\n    regular.append(p)\nif total > 32 * 1024 * 1024:\n    raise SystemExit('Evidence payload exceeds 32 MiB')\narchive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qualification-visual-receipts.tar.gz'\nwith tarfile.open(archive, 'w:gz') as output:\n    for p in regular:\n        output.add(p, arcname=str(p.relative_to(root)), recursive=False)\nif archive.stat().st_size > 32 * 1024 * 1024:\n    archive.unlink()\n    raise SystemExit('Compressed evidence payload exceeds 32 MiB')\nprint('QUALIFICATION EVIDENCE PAYLOAD BYTES ' + str(archive.stat().st_size))\n"
      - name: Retain one bounded evidence artifact for visual review
        uses: actions/upload-artifact@v7
        with:
          name: qualification-visual-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/qualification-visual-receipts.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
    timeout-minutes: 20
  suites-ran:
    name: Suites ran
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.test.result }}
          UNIT_TESTS: ${{ needs.test.outputs.tests }}
          UNIT_SKIPPED: ${{ needs.test.outputs.skipped }}
          E2E_EXPECTED: ${{ needs.test.outputs.e2e_expected }}
          E2E_SKIPPED: ${{ needs.test.outputs.e2e_skipped }}
          DELIVERY_PASSED: ${{ needs.test.outputs.delivery_passed }}
          DELIVERY_SKIPPED: ${{ needs.test.outputs.delivery_skipped }}
        run: "fail=0\ncheck() {\n  name=\"$1\"; result=\"$2\"; tests=\"${3:-0}\"; skipped=\"${4:-0}\"; allowed=\"$5\"\n  echo \"$name: result=$result tests=$tests skipped=$skipped (allowed skipped: $allowed)\"\n  [ \"$result\" = success ] || { echo \"  $name did not succeed\"; fail=1; }\n  [ \"$tests\" -ge 1 ] || { echo \"  $name counted no tests\"; fail=1; }\n  [ \"$skipped\" -le \"$allowed\" ] || { echo \"  $name skipped more than allowed\"; fail=1; }\n}\ncheck unit \"$RESULT\" \"$UNIT_TESTS\" \"$UNIT_SKIPPED\" 0\ncheck source-browser \"$RESULT\" \"$E2E_EXPECTED\" \"$E2E_SKIPPED\" 30\ncheck delivery-browser \"$RESULT\" \"$DELIVERY_PASSED\" \"$DELIVERY_SKIPPED\" 0\n[ \"$E2E_EXPECTED\" = 435 ] && [ \"$E2E_SKIPPED\" = 30 ] || fail=1\n[ \"$DELIVERY_PASSED\" = 42 ] && [ \"$DELIVERY_SKIPPED\" = 0 ] || fail=1\nexit \"$fail\"\n"
    timeout-minutes: 5
permissions:
  contents: read
